name: Check models
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/01_balanced_capacity.py --days 30 --runs 100 --output-dir outputs/smoke
      - run: node tests/check_live_player.cjs outputs/smoke/figures/01_live_queue.html
